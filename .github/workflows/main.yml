name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Structure
      run: |
        mkdir -p app/src/main
        # Sirf Kotlin, Gradle aur XML files ko app folder me bhej rahe hain
        mv *.kt app/src/main/ 2>/dev/null || true
        mv *.xml app/src/main/ 2>/dev/null || true
        mv build.gradle app/ 2>/dev/null || true
        mv proguard-rules.pro app/ 2>/dev/null || true
        ls -la app

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
