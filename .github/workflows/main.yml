name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create App Folder & Move Files
      run: |
        mkdir -p app/src/main
        # Sabhi Kotlin aur Layout files ko app folder ke andar bhej rahe hain
        find . -maxdepth 1 ! -name '.' ! -name '.github' ! -name 'app' -exec mv {} app/ \;
        ls -R app

    - name: Fix Gradle Wrapper
      run: |
        cd app && gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x app/gradlew

    - name: Build Debug APK
      run: cd app && ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
