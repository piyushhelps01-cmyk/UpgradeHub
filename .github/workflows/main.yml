name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Layout
      run: |
        # Ek standard android app folder structure bana rahe hain
        mkdir -p app/src/main/java app/src/main/res
        
        # Jitni bhi kotlin aur xml files hain unhe sahi jagah bhej rahe hain
        mv *.kt app/src/main/java/ 2>/dev/null || true
        mv *.xml app/src/main/res/ 2>/dev/null || true
        
        # Agar bahar build.gradle ya settings.gradle hai toh unhe set kar rahe hain
        if [ -f "build.gradle" ]; then mv build.gradle app/; fi

    - name: Create basic settings.gradle if missing
      run: |
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi

    - name: Setup Gradle Wrapper and Build
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
