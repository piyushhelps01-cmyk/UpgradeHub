name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Project and Gradle Wrapper
      run: |
        mkdir -p app/src/main/java app/src/main/res
        
        # Sabhi kotlin aur xml files ko sahi jagah pahuncha rahe hain
        mv *.kt app/src/main/java/ 2>/dev/null || true
        mv *.xml app/src/main/res/ 2>/dev/null || true
        mv build.gradle app/ 2>/dev/null || true
        mv settings.gradle . 2>/dev/null || true

        # Gradle wrapper apne aap generate karega taaki jar file ki koi dikkat na ho
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
