name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-Fix Project Structure
      run: |
        # Ek naya app folder aur uske andar standard folders bana rahe hain
        mkdir -p app/src/main/java app/src/main/res
        
        # Jitni bhi .kt (Kotlin) files hain unhe java folder me move kar rahe hain
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/ \; 2>/dev/null || true
        
        # Jitni bhi .xml files hain unhe res folder me move kar rahe hain
        find . -maxdepth 1 -name "*.xml" -exec mv {} app/src/main/res/ \; 2>/dev/null || true
        
        # Agar root me build.gradle hai toh use app folder me bhej rahe hain
        if [ -f "build.gradle" ]; then
          mv build.gradle app/
        fi
        
        # Sahi settings.gradle file bana rahe hain taaki app folder recognise ho jaye
        echo "include ':app'" > settings.gradle

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
